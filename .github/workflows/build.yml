name: build-patch
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: build
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o icloud-privacy-mail ./cmd/panel
      - uses: actions/upload-artifact@v4
        with:
          name: icloud-privacy-mail-patch
          path: icloud-privacy-mail
